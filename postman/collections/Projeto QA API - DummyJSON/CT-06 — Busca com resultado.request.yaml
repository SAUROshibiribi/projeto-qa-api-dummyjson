$kind: http-request
url: https://dummyjson.com/products/search?q=phone
method: GET
queryParams:
  q: phone
scripts:
  - type: afterResponse
    code: "pm.test(\"Tempo de resposta abaixo de 1000 ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(1000);\r

      });\r

      \r

      pm.test(\"Status 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"A busca retorna pelo menos um produto\", function () {\r

      \    const r = pm.response.json();\r

      \    pm.expect(r.products).to.be.an(\"array\");\r

      \    pm.expect(r.products.length).to.be.above(0);\r

      });"
    language: text/javascript
order: 7000
